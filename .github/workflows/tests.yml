name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and device adapter
        run: uv sync --locked --extra device
      - name: Check offline commands
        run: |
          uv run --no-sync gps --help
          uv run --no-sync gps --dry-run --coord-system gcj02 28.169004 112.945261
      - name: Run tests without a phone
        run: uv run --no-sync python -m unittest discover -s tests -v
